<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080D">
<title>Berlin Mods — Admin Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080D; --surface: #11131f; --surface-2: rgba(255,255,255,0.05);
    --line: rgba(255,255,255,0.1); --emerald: #10B981; --violet: #7C3AED;
    --text: #F1F5F9; --muted: #8E97B0; --grad: linear-gradient(135deg,#10B981,#7C3AED);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; padding-bottom: 90px; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 14px 16px; }
  .top {
    position: sticky; top: 0; z-index: 20; background: rgba(7,8,13,0.92);
    border-bottom: 1px solid var(--line); padding: 12px 16px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  }
  .top h1 { margin: 0; font-family: 'Fredoka', sans-serif; font-size: 20px; }
  .top span { font-size: 11px; color: var(--emerald); display: block; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-radius: 999px; font-weight: 700; font-size: 12.5px;
    padding: 9px 14px; cursor: pointer; font-family: inherit; color: #fff;
  }
  .btn-primary { background: var(--grad); }
  .btn-ghost { background: rgba(255,255,255,0.07); border: 1px solid var(--line); color: var(--text); }
  .btn-danger { background: rgba(239,68,68,0.16); border: 1px solid rgba(239,68,68,0.45); color: #fca5a5; }
  .btn-sm { padding: 6px 11px; font-size: 12px; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px; margin-bottom: 14px;
  }
  .card h2 { margin: 0 0 10px; font-size: 15px; font-family: 'Fredoka', sans-serif; color: var(--emerald); }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  label.f { display: block; margin-bottom: 10px; }
  label.f span { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  input[type="text"], input[type="url"], input[type="password"], textarea {
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--line);
    border-radius: 12px; color: var(--text); padding: 10px 12px; font-size: 13.5px; font-family: inherit; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--violet); }

  .app-item {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); margin-bottom: 10px;
  }
  .app-icon { width: 48px; height: 48px; border-radius: 13px; overflow: hidden; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 22px; background: #1e293b; }
  .app-icon img { width: 100%; height: 100%; object-fit: cover; }
  .app-meta { flex: 1 1 180px; min-width: 0; }
  .app-meta b { display: block; font-size: 14.5px; }
  .app-meta small { color: var(--muted); font-size: 12px; }
  .app-btns { display: flex; flex-wrap: wrap; gap: 6px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 40; display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 16px; }
  .modal-bg.open { display: flex; }
  .modal { width: min(100%, 560px); background: #11131f; border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin: auto; }
  .modal h3 { margin: 0 0 12px; font-family: 'Fredoka', sans-serif; font-size: 18px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #141827; border: 1px solid var(--emerald); color: #fff;
    padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 13px;
    z-index: 90; display: none;
  }
  .toast.show { display: block; }
  pre { background: rgba(0,0,0,0.35); border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>BERLIN MODS<span>Admin &amp; APK Manager</span></h1>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button class="btn btn-ghost btn-sm" id="addBtn" type="button">+ Add APK</button>
    <button class="btn btn-primary btn-sm" id="publishBtn" type="button">Publish to GitHub</button>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2>1. GitHub Sync &amp; File</h2>
    <div class="grid-2">
      <label class="f"><span>GitHub Repo (owner/repo)</span><input id="ghRepo" type="text" value="BerlinModsdotcom/Berlin-Mods"></label>
      <label class="f"><span>Branch</span><input id="ghBranch" type="text" value="main"></label>
    </div>
    <label class="f"><span>GitHub Personal Access Token (saved only in your browser)</span>
      <input id="ghToken" type="password" placeholder="ghp_... (needed only for 1-click Publish / Load)">
    </label>
    <div style="display:flex;flex-wrap:wrap;gap:8px;">
      <button class="btn btn-ghost btn-sm" id="loadGhBtn" type="button">Load from GitHub</button>
      <button class="btn btn-ghost btn-sm" id="importFileBtn" type="button">Import index.html</button>
      <input id="importFile" type="file" accept=".html,text/html" hidden>
      <button class="btn btn-ghost btn-sm" id="downloadHtmlBtn" type="button">Download index.html</button>
      <button class="btn btn-ghost btn-sm" id="copyAppsBtn" type="button">Copy APPS Code</button>
    </div>
  </div>

  <div class="card">
    <h2>2. Your Apps (<span id="appCount">0</span>)</h2>
    <div id="appList"></div>
  </div>
</div>

<!-- Edit / Add App Modal -->
<div class="modal-bg" id="editBg">
  <form class="modal" id="editForm">
    <h3 id="editTitle">Edit APK</h3>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
      <div class="app-icon" id="edPreview" style="width:60px;height:60px;"></div>
      <div style="flex:1;">
        <button class="btn btn-ghost btn-sm" id="edLogoBtn" type="button">Upload Logo Image</button>
        <input id="edLogoFile" type="file" accept="image/*" hidden>
        <div style="font-size:11px;color:var(--muted);margin-top:4px;">Auto-resized to 192×192 HD PNG</div>
      </div>
    </div>

    <div class="grid-2">
      <label class="f"><span>App Name</span><input id="edName" type="text" required></label>
      <label class="f"><span>Unique ID (no spaces)</span><input id="edId" type="text" required></label>
      <label class="f"><span>Version</span><input id="edVersion" type="text" placeholder="v1.0.0"></label>
      <label class="f"><span>Size</span><input id="edSize" type="text" placeholder="68.3 MB"></label>
      <label class="f"><span>Android</span><input id="edAndroid" type="text" value="Android 6.0+"></label>
      <label class="f"><span>Updated Date</span><input id="edUpdated" type="text"></label>
    </div>

    <label class="f"><span>APK Download URL</span><input id="edApk" type="url" placeholder="https://github.com/..."></label>
    <label class="f"><span>Mirror URL (optional)</span><input id="edMirror" type="url"></label>

    <div class="grid-2">
      <label class="f"><span>Categories (comma separated)</span><input id="edTags" type="text" placeholder="premium, trending, tools"></label>
      <label class="f"><span>Badges (comma separated)</span><input id="edBadges" type="text" placeholder="PREMIUM UNLOCKED, LATEST VERSION"></label>
    </div>

    <label class="f"><span>Features (one per line)</span><textarea id="edFeatures" rows="3"></textarea></label>
    <label class="f"><span>Extra Note HTML (optional)</span><textarea id="edNote" rows="2" placeholder="<strong>Note:</strong> ..."></textarea></label>

    <label style="display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer;">
      <input id="edFeatured" type="checkbox" checked> <span>Show in Featured Releases</span>
    </label>

    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-ghost" id="edCancel" type="button">Cancel</button>
      <button class="btn btn-primary" type="submit">Save App</button>
    </div>
  </form>
</div>

<!-- Telegram Post Preview Modal -->
<div class="modal-bg" id="tgBg">
  <div class="modal">
    <h3>@PostBot Message &amp; Buttons</h3>
    <pre id="tgPostText"></pre>
    <pre id="tgPostBtns"></pre>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
      <button class="btn btn-ghost btn-sm" id="copyTgText" type="button">Copy Message</button>
      <button class="btn btn-primary btn-sm" id="copyTgBtns" type="button">Copy Buttons</button>
      <button class="btn btn-ghost btn-sm" id="tgClose" type="button">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  var $ = function (id) { return document.getElementById(id); };
  var editIdx = -1, currentLogoUrl = '', importedHtmlTemplate = '';

  try {
    $('ghRepo').value = localStorage.getItem('bm_gh_repo') || 'BerlinModsdotcom/Berlin-Mods';
    $('ghBranch').value = localStorage.getItem('bm_gh_branch') || 'main';
    $('ghToken').value = localStorage.getItem('bm_gh_token') || '';
  } catch (e) {}

  ['ghRepo', 'ghBranch', 'ghToken'].forEach(function (id) {
    $(id).addEventListener('input', function () {
      try { localStorage.setItem('bm_' + id.replace('gh', 'gh_').toLowerCase(), $(id).value.trim()); } catch (e) {}
    });
  });

  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderList() {
    $('appCount').textContent = APPS.length;
    $('appList').innerHTML = APPS.map(function (a, i) {
      var ic = a.iconUrl ? '<img src="' + esc(a.iconUrl) + '" alt="">' : esc(a.icon || '📱');
      return '<div class="app-item">' +
        '<div class="app-icon">' + ic + '</div>' +
        '<div class="app-meta"><b>' + esc(a.name) + '</b><small>' + esc(a.version) + ' · ' + esc(a.size) + '</small></div>' +
        '<div class="app-btns">' +
        '<button class="btn btn-ghost btn-sm" data-move="-1" data-i="' + i + '" type="button">↑</button>' +
        '<button class="btn btn-ghost btn-sm" data-move="1" data-i="' + i + '" type="button">↓</button>' +
        '<button class="btn btn-ghost btn-sm" data-tg="' + i + '" type="button">Post</button>' +
        '<button class="btn btn-primary btn-sm" data-edit="' + i + '" type="button">Edit</button>' +
        '<button class="btn btn-danger btn-sm" data-del="' + i + '" type="button">✕</button>' +
        '</div></div>';
    }).join('');
  }

  function openEdit(idx) {
    editIdx = idx;
    var a = idx >= 0 ? APPS[idx] : {
      id: '', name: '', icon: '📱', bg: ['#10B981', '#7C3AED'], iconUrl: '',
      version: 'v1.0.0', size: '', android: 'Android 6.0+',
      updated: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
      tags: ['premium', 'trending'], badges: ['PREMIUM UNLOCKED', 'LATEST VERSION'],
      featured: true, features: ['Premium Unlocked'], noteHtml: '', apk: '', mirror: ''
    };
    $('editTitle').textContent = idx >= 0 ? 'Edit ' + a.name : 'Add New APK';
    currentLogoUrl = a.iconUrl || '';
    $('edPreview').innerHTML = currentLogoUrl ? '<img src="' + esc(currentLogoUrl) + '" alt="">' : esc(a.icon || '📱');
    $('edName').value = a.name || '';
    $('edId').value = a.id || '';
    $('edVersion').value = a.version || '';
    $('edSize').value = a.size || '';
    $('edAndroid').value = a.android || 'Android 6.0+';
    $('edUpdated').value = a.updated || '';
    $('edApk').value = a.apk || '';
    $('edMirror').value = a.mirror || '';
    $('edTags').value = (a.tags || []).join(', ');
    $('edBadges').value = (a.badges || []).join(', ');
    $('edFeatures').value = (a.features || []).join('\n');
    $('edNote').value = a.noteHtml || '';
    $('edFeatured').checked = !!a.featured;
    $('editBg').classList.add('open');
  }

  $('addBtn').addEventListener('click', function () { openEdit(-1); });
  $('edCancel').addEventListener('click', function () { $('editBg').classList.remove('open'); });

  $('edLogoBtn').addEventListener('click', function () { $('edLogoFile').click(); });
  $('edLogoFile').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var img = new Image();
    img.onload = function () {
      var c = document.createElement('canvas');
      c.width = 192; c.height = 192;
      var ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, 192, 192);
      currentLogoUrl = c.toDataURL('image/png');
      $('edPreview').innerHTML = '<img src="' + currentLogoUrl + '" alt="">';
      toast('Logo resized to 192×192 PNG');
    };
    img.src = URL.createObjectURL(file);
  });

  $('editForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var obj = {
      id: $('edId').value.trim() || $('edName').value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-'),
      name: $('edName').value.trim(),
      icon: '📱',
      bg: (editIdx >= 0 && APPS[editIdx].bg) ? APPS[editIdx].bg : ['#10B981', '#7C3AED'],
      iconUrl: currentLogoUrl,
      version: $('edVersion').value.trim(),
      size: $('edSize').value.trim(),
      android: $('edAndroid').value.trim(),
      updated: $('edUpdated').value.trim(),
      tags: $('edTags').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean),
      badges: $('edBadges').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean),
      featured: $('edFeatured').checked,
      features: $('edFeatures').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean),
      apk: $('edApk').value.trim(),
      mirror: $('edMirror').value.trim()
    };
    if ($('edNote').value.trim()) obj.noteHtml = $('edNote').value.trim();
    if (editIdx >= 0) APPS[editIdx] = obj;
    else APPS.unshift(obj);
    $('editBg').classList.remove('open');
    renderList();
    toast('Saved in editor (click Publish or Download)');
  });

  $('appList').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.edit !== undefined) openEdit(Number(b.dataset.edit));
    else if (b.dataset.del !== undefined) {
      var idx = Number(b.dataset.del);
      if (confirm('Delete ' + APPS[idx].name + '?')) { APPS.splice(idx, 1); renderList(); }
    } else if (b.dataset.move !== undefined) {
      var i = Number(b.dataset.i), dir = Number(b.dataset.move), ni = i + dir;
      if (ni >= 0 && ni < APPS.length) { var tmp = APPS[i]; APPS[i] = APPS[ni]; APPS[ni] = tmp; renderList(); }
    } else if (b.dataset.tg !== undefined) {
      var a = APPS[Number(b.dataset.tg)];
      var safeName = a.name.replace(/\s+/g, '_') + '_[BerlinMods].apk';
      var feats = (a.features || []).map(function (f) { return '✔️ ' + f; }).join('\n\n');
      $('tgPostText').textContent = safeName + '\n\nVersion: ' + a.version + '\nSize: ' + a.size + '\n\n' + feats + '\n\nRelease By @BerlinMods\n\nJoin Main Channels\n👇 Also !';
      $('tgPostBtns').textContent = 'Download APK - https://berlinmodsdotcom.github.io/Berlin-Mods/#app=' + encodeURIComponent(a.id) + '\nMain Channel - https://t.me/+Le54UoEhXUc5ODJl | Community Group - https://t.me/BerlinModsCommunity';
      $('tgBg').classList.add('open');
    }
  });

  $('tgClose').addEventListener('click', function () { $('tgBg').classList.remove('open'); });
  $('copyTgText').addEventListener('click', function () { navigator.clipboard.writeText($('tgPostText').textContent); toast('Message copied'); });
  $('copyTgBtns').addEventListener('click', function () { navigator.clipboard.writeText($('tgPostBtns').textContent); toast('Buttons copied'); });

  function buildAppsCode() {
    return 'var APPS = ' + JSON.stringify(APPS, null, 2) + ';';
  }

  function patchHtml(baseHtml) {
    return baseHtml.replace(/var APPS = \[[\s\S]*?\];/, function () { return buildAppsCode(); });
  }

  $('copyAppsBtn').addEventListener('click', function () {
    navigator.clipboard.writeText(buildAppsCode()).then(function () { toast('APPS code copied'); });
  });

  $('importFileBtn').addEventListener('click', function () { $('importFile').click(); });
  $('importFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    f.text().then(function (txt) {
      importedHtmlTemplate = txt;
      var m = txt.match(/var APPS = (\[[\s\S]*?\]);/);
      if (m) {
        APPS = Function('return ' + m[1])();
        renderList();
        toast('Imported ' + APPS.length + ' apps from index.html');
      } else {
        toast('Could not find APPS in file');
      }
    });
  });

  $('downloadHtmlBtn').addEventListener('click', function () {
    if (!importedHtmlTemplate) { toast('Import your index.html (or Load from GitHub) first'); return; }
    var out = patchHtml(importedHtmlTemplate);
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out], { type: 'text/html' }));
    a.download = 'index.html';
    a.click();
    toast('Downloaded updated index.html');
  });

  async function ghGetFile() {
    var repo = $('ghRepo').value.trim(), branch = $('ghBranch').value.trim(), token = $('ghToken').value.trim();
    var headers = { 'Accept': 'application/vnd.github+json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    var r = await fetch('https://api.github.com/repos/' + repo + '/contents/index.html?ref=' + encodeURIComponent(branch), { headers: headers });
    if (!r.ok) throw new Error('GitHub load failed (' + r.status + ')');
    return await r.json();
  }

  $('loadGhBtn').addEventListener('click', async function () {
    try {
      var data = await ghGetFile();
      var txt = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
      importedHtmlTemplate = txt;
      var m = txt.match(/var APPS = (\[[\s\S]*?\]);/);
      if (m) { APPS = Function('return ' + m[1])(); renderList(); toast('Loaded ' + APPS.length + ' apps from GitHub'); }
    } catch (err) { toast(err.message); }
  });

  $('publishBtn').addEventListener('click', async function () {
    var repo = $('ghRepo').value.trim(), branch = $('ghBranch').value.trim(), token = $('ghToken').value.trim();
    if (!token) { toast('Enter your GitHub Token first'); return; }
    try {
      var data = await ghGetFile();
      var txt = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
      var updated = patchHtml(txt);
      var b64 = btoa(unescape(encodeURIComponent(updated)));
      var r = await fetch('https://api.github.com/repos/' + repo + '/contents/index.html', {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'Update APPS via Berlin Mods Admin', content: b64, sha: data.sha, branch: branch })
      });
      if (!r.ok) throw new Error('Publish failed (' + r.status + ')');
      toast('Published to GitHub!');
    } catch (err) { toast(err.message); }
  });

  renderList();
})();
</script>
</body>
</html>
