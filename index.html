<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090A0F">
<title>Berlin Mods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090A0F; --card:rgba(20,22,34,0.7); --card-solid:#14162200;
    --line:rgba(255,255,255,0.08);
    --violet:#7C3AED; --emerald:#10B981;
    --text:#EEF0F6; --muted:#8A90A6;
    --grad:linear-gradient(135deg,#10B981,#7C3AED);
    --display:'Fredoka','Arial Rounded MT Bold',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --body:'Nunito','Arial Rounded MT Bold',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:var(--body);font-size:14px;line-height:1.4;
  }
  /* ambient glow blobs */
  body::before,body::after{
    content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(70px);
  }
  body::before{width:360px;height:360px;top:-120px;left:-120px;background:radial-gradient(circle,rgba(124,58,237,0.38),transparent 70%);}
  body::after{width:340px;height:340px;bottom:-110px;right:-110px;background:radial-gradient(circle,rgba(16,185,129,0.28),transparent 70%);}
  [hidden]{display:none !important;}
  button{font-family:inherit;color:inherit;}
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:2px solid var(--emerald);outline-offset:2px;}

  .app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-bottom:110px;overflow-x:clip;}
  .pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}

  /* glass surface + gradient edge on hover / tap */
  .glass{
    position:relative;background:var(--card);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:18px;
    transition:transform .15s ease, box-shadow .25s ease;
  }
  .glass::before{
    content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:var(--grad);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
    mask-composite:exclude;opacity:0;transition:opacity .25s ease;pointer-events:none;
  }
  .glass:hover::before,.glass:active::before,.glass:focus-within::before{opacity:1;}
  .glass:hover{box-shadow:0 0 22px rgba(124,58,237,0.22);}

  /* ---- Header ---- */
  .top{
    position:sticky;top:0;z-index:30;
    padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
    background:rgba(9,10,15,0.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:none;padding:0;cursor:pointer;}
  .logo-box{
    width:36px;height:36px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:none;border:none;padding:0;
    filter:drop-shadow(0 0 10px rgba(124,58,237,0.55)) drop-shadow(0 0 18px rgba(16,185,129,0.3));
  }
  .logo-box img{width:100%;height:100%;object-fit:contain;display:block;}
  .logo-box svg{width:100%;height:100%;}
  .brand-name{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:0.04em;text-transform:uppercase;line-height:1.1;text-align:left;color:#fff;}
  .brand-name span{
    display:block;letter-spacing:0.04em;font-size:18px;
    color:#fff;
  }

  /* ---- Buttons ---- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;
    border-radius:999px;font-weight:700;font-size:13px;padding:10px 16px;white-space:nowrap;
    transition:transform .12s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{
    background:var(--grad);color:#fff;
    box-shadow:0 0 16px rgba(16,185,129,0.35),0 4px 18px rgba(124,58,237,0.35);
  }
  .btn-primary:hover{box-shadow:0 0 22px rgba(16,185,129,0.55),0 4px 24px rgba(124,58,237,0.5);}
  .btn-ghost{background:rgba(255,255,255,0.07);color:var(--text);border:1px solid var(--line);}
  .btn-ghost:hover{background:rgba(255,255,255,0.12);}
  .btn-sm{padding:8px 14px;font-size:12.5px;}
  .btn-block{width:100%;padding:14px 18px;font-size:14.5px;}

  /* ---- Search ---- */
  .search{margin-top:14px;display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:999px;height:48px;transition:box-shadow .2s ease,border-color .2s ease;}
  .search:focus-within{border-color:rgba(124,58,237,0.7);box-shadow:0 0 0 3px rgba(124,58,237,0.25),0 0 24px rgba(16,185,129,0.25);}
  .search svg{width:18px;height:18px;flex:0 0 auto;color:var(--muted);}
  .search input{
    flex:1;min-width:0;height:100%;background:none;border:none;outline:none;color:var(--text);font-size:15px;font-family:inherit;
  }
  .search input::placeholder{color:var(--muted);}
  .search .clear{display:none;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;}
  .search.has-text .clear{display:block;}

  /* ---- Pills ---- */
  .pills{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none;}
  .pills::-webkit-scrollbar{display:none;}
  .pill{
    flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,0.04);color:var(--muted);
    padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;
    transition:all .2s ease, transform .12s ease;
  }
  .pill:active{transform:scale(0.97);}
  .pill.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 0 16px rgba(16,185,129,0.4);}

  .section-title{font-family:var(--display);font-weight:600;font-size:16px;margin:20px 0 10px;display:flex;align-items:center;gap:8px;}
  .section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--grad);box-shadow:0 0 10px var(--emerald);}

  /* ---- Carousel ---- */
  .carousel{
    display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;cursor:grab;
    padding:2px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
    scroll-padding-left:16px;scrollbar-width:none;
  }
  .carousel::-webkit-scrollbar{display:none;}
  .feat{
    flex:0 0 min(72%,250px);scroll-snap-align:start;padding:16px;display:flex;flex-direction:column;gap:12px;
    /* solid background, no blur: blur on moving cards makes swiping choppy on phones */
    background:linear-gradient(160deg,#1e1a38,#141622 55%);
    -webkit-backdrop-filter:none;backdrop-filter:none;
  }
  .feat-top{display:flex;align-items:center;gap:12px;}
  .feat h3{margin:0;font-size:15px;font-family:var(--display);font-weight:600;}
  .feat .sub{font-size:12px;color:var(--muted);}
  .feat-actions{display:flex;gap:8px;}
  .feat-actions .btn{flex:1;}

  /* ---- Icons ---- */
  .icon{
    width:54px;height:54px;border-radius:15px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:25px;color:#fff;overflow:hidden;box-shadow:0 0 16px rgba(255,255,255,0.06);
  }
  .icon img{width:100%;height:100%;object-fit:cover;}

  /* ---- List rows ---- */
  .list{display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:14px;}
  .row-info{flex:1 1 150px;min-width:0;}
  .row-name{font-weight:700;font-size:15px;margin:0 0 2px;overflow-wrap:anywhere;}
  .row-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
  .badge{
    font-size:10px;font-weight:800;letter-spacing:0.06em;padding:3px 8px;border-radius:999px;
    color:#c9b3ff;border:1px solid rgba(124,58,237,0.7);background:rgba(124,58,237,0.12);
    box-shadow:0 0 10px rgba(124,58,237,0.3);
  }
  .badge.g{color:#6ee7b7;border-color:rgba(16,185,129,0.7);background:rgba(16,185,129,0.12);box-shadow:0 0 10px rgba(16,185,129,0.3);}
  .row-actions{display:flex;gap:8px;margin-left:auto;}

  /* ---- Ad ---- */
  .ad{display:flex;align-items:center;gap:12px;padding:14px;background:linear-gradient(120deg,rgba(16,185,129,0.1),rgba(20,22,34,0.7));}
  .ad .tag{position:absolute;top:8px;right:12px;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
  .ad .ad-body{flex:1;min-width:0;padding-top:6px;}
  .ad h4{margin:0 0 2px;font-size:14px;overflow-wrap:anywhere;}
  .ad p{margin:0;font-size:12px;color:var(--muted);}

  /* ---- Telegram card ---- */
  .tg{display:flex;align-items:center;gap:14px;padding:16px;background:linear-gradient(120deg,rgba(42,171,238,0.18),rgba(16,185,129,0.12) 60%,rgba(20,22,34,0.7));border-color:rgba(42,171,238,0.35);}
  .tg-ic{width:56px;height:56px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 0 18px rgba(42,171,238,0.5);}
  .tg-ic svg{width:32px;height:32px;}
  .tg h3{margin:0;font-size:15px;font-family:var(--display);}
  .tg p{margin:2px 0 10px;font-size:12.5px;color:var(--muted);}

  .empty{text-align:center;color:var(--muted);padding:40px 10px;}
  .empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:4px;font-family:var(--display);}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:26px 16px 6px;}
  footer a{color:var(--emerald);}

  /* ---- Floating Telegram pill ---- */
  .fab{
    position:fixed;z-index:25;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
    display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;font-weight:700;font-size:13px;color:#fff;
    background:linear-gradient(135deg,#2AABEE,#7C3AED);box-shadow:0 0 20px rgba(42,171,238,0.5),0 6px 22px rgba(0,0,0,0.5);
    transition:transform .12s ease;
  }
  .fab:active{transform:scale(0.96);}
  .fab svg{width:18px;height:18px;}

  /* ---- Overlay, sheet, modal ---- */
  .overlay{
    position:fixed;inset:0;z-index:60;background:rgba(3,4,8,0.7);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s;
  }
  .overlay.open{opacity:1;visibility:visible;}
  .sheet{
    position:fixed;z-index:70;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:88vh;overflow-y:auto;
    background:rgba(18,20,31,0.96);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;
    padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
    transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden;
    box-shadow:0 -10px 50px rgba(124,58,237,0.25);
  }
  .sheet.open{transform:translateY(0);visibility:visible;}
  .sheet.dragging{transition:none;}
  .grab{width:44px;height:5px;border-radius:999px;background:rgba(255,255,255,0.2);margin:2px auto 14px;touch-action:none;cursor:grab;}
  .sheet-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .sheet-head h2{margin:0 0 2px;font-size:20px;font-family:var(--display);}
  .sheet-close{margin-left:auto;align-self:flex-start;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,0.06);cursor:pointer;font-size:15px;}
  .sheet h3{font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--emerald);margin:18px 0 8px;}
  .feat-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .feat-list li{display:flex;gap:10px;align-items:flex-start;font-size:14px;}
  .feat-list li::before{content:"✓";color:var(--emerald);font-weight:800;}
  .specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .spec{padding:12px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--line);}
  .spec span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px;}
  .spec b{font-size:14px;font-variant-numeric:tabular-nums;}
  .sheet-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px;}

  .modal{
    position:fixed;z-index:70;left:50%;top:50%;width:min(92vw,420px);max-height:88vh;overflow-y:auto;
    transform:translate(-50%,-46%) scale(0.96);opacity:0;visibility:hidden;
    background:rgba(18,20,31,0.97);border:1px solid var(--line);border-radius:22px;padding:22px;
    transition:transform .25s ease,opacity .25s ease,visibility .25s;box-shadow:0 0 50px rgba(124,58,237,0.3);
  }
  .modal.open{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible;}
  .modal h2{margin:0 0 4px;font-size:20px;font-family:var(--display);}
  .modal p.lead{margin:0 0 16px;color:var(--muted);font-size:13px;}
  .field{display:block;margin-bottom:14px;}
  .field span{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--muted);}
  .field input,.field textarea{
    width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:14px;color:var(--text);
    padding:12px 14px;font-size:15px;font-family:inherit;outline:none;resize:vertical;
  }
  .field input:focus,.field textarea:focus{border-color:rgba(124,58,237,0.8);box-shadow:0 0 0 3px rgba(124,58,237,0.25);}
  .field .err{display:none;color:#fca5a5;font-size:12px;margin-top:6px;}
  .field.bad .err{display:block;}
  .field.bad input{border-color:#f87171;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions .btn{flex:1;padding:13px 16px;}

  /* ---- Toast ---- */
  .toast{
    position:fixed;z-index:90;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
    max-width:min(90vw,420px);padding:12px 20px;border-radius:999px;font-weight:600;font-size:13.5px;text-align:center;
    background:rgba(24,26,40,0.96);border:1px solid rgba(16,185,129,0.5);box-shadow:0 0 22px rgba(16,185,129,0.3);
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  .pills{-webkit-overflow-scrolling:touch;}
  /* touch screens: skip hover glow so scrolling stays smooth */
  @media (hover:none){
    .glass:hover{box-shadow:none;}
    .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(20,22,34,0.92);}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:0.01ms !important;animation-duration:0.01ms !important;scroll-behavior:auto !important;}
  }
</style>
</head>

(function () {

  }

  function rowHTML(a) {
    return '<article class="row glass">' + iconHTML(a) +
      '<div class="row-info">' +
      (a.badges && a.badges.length ? '<div class="badges">' + badgesHTML(a) + '</div>' : '') +
      '<h3 class="row-name">' + esc(a.name) + '</h3>' +
      '<div class="row-meta">' + esc(a.version) + ' · ' + esc(a.size) + '</div></div>' +
      '<div class="row-actions">' +
      '<button class="btn btn-ghost btn-sm" data-act="details" data-id="' + esc(a.id) + '" type="button">Details</button>' +
      '<button class="btn btn-primary btn-sm" data-act="download" data-id="' + esc(a.id) + '" type="button">Download</button>' +
      '</div></article>';
  }

  function adHTML(ad) {
    return '<a class="ad glass" href="' + esc(ad.href) + '" target="_blank" rel="noopener sponsored">' +
      '<span class="tag">Sponsored</span>' + iconHTML(ad) +
      '<div class="ad-body"><h4>' + esc(ad.title) + '</h4><p>' + esc(ad.text) + '</p></div>' +
      '<span class="btn btn-primary btn-sm">' + esc(ad.cta) + '</span></a>';
  }

  var TG_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#2AABEE"/><path fill="#fff" d="M17.9 7.1 5.6 11.8c-.8.3-.8.8-.1 1l3 .9 1.2 3.6c.1.4.3.5.6.5s.4-.1.6-.3l1.5-1.4 3 2.2c.5.3.9.1 1.1-.5l2-9.4c.2-.8-.3-1.1-.9-.9zm-8 5.2 6.4-4c.3-.2.6-.1.3.1l-5.3 4.8-.2 2.2z"/></svg>';
  function tgHTML() {
    return '<section class="tg glass"><div class="tg-ic">' + TG_ICON + '</div>' +
      '<div><h3>Telegram community</h3><p>@Berlinmods · new drops land here first</p>' +
      '<a class="btn btn-primary btn-sm" href="' + TELEGRAM + '" target="_blank" rel="noopener">Join Channel</a></div></section>';
  }

  function renderList(items) {
    var html = '', adIdx = 0, tgDone = false;
    items.forEach(function (a, i) {
      html += rowHTML(a);
      if ((i + 1) % 3 === 0 && ADS.length) { html += adHTML(ADS[adIdx % ADS.length]); adIdx++; }
      if (i === 1 && !state.q) { html += tgHTML(); tgDone = true; }
    });
    if (!tgDone && !state.q) html += tgHTML();
    if (!items.length) {
      html = '<div class="empty"><strong>No mods found</strong>Try another word, or request it with the button above.</div>' + tgHTML();
    }
    $('list').innerHTML = html;
  }

  function render() {
    var items = APPS.filter(matches);
    renderFeatured(items);
    renderList(items);
    $('listTitle').textContent = state.q ? ('Results (' + items.length + ')') : (state.cat === 'all' ? 'Latest releases' : 'Latest ' + document.querySelector('.pill.active').textContent.toLowerCase());
  }

  /* ---- Events: search, pills ---- */
  $('searchInput').addEventListener('input', function (e) {
    state.q = e.target.value.trim().toLowerCase();
    $('searchWrap').classList.toggle('has-text', !!e.target.value);
    render();
  });
  $('clearBtn').addEventListener('click', function () {
    $('searchInput').value = ''; state.q = ''; $('searchWrap').classList.remove('has-text');
    $('searchInput').focus(); render();
  });
  $('pills').addEventListener('click', function (e) {
    var p = e.target.closest('.pill'); if (!p) return;
    document.querySelectorAll('.pill').forEach(function (b) {
      var on = b === p; b.classList.toggle('active', on); b.setAttribute('aria-selected', on);
    });
    state.cat = p.getAttribute('data-cat');
    render();
  });
  $('homeBtn').addEventListener('click', function () {
    state.cat = 'all'; state.q = ''; $('searchInput').value = ''; $('searchWrap').classList.remove('has-text');
    document.querySelectorAll('.pill').forEach(function (b) {
      var on = b.getAttribute('data-cat') === 'all'; b.classList.toggle('active', on); b.setAttribute('aria-selected', on);
    });
    render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ---- Delegated clicks for Details / Download ---- */
  var currentApp = null;
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]'); if (!btn) return;
    var app = findApp(btn.getAttribute('data-id')); if (!app) return;
    if (btn.getAttribute('data-act') === 'download') download(app, false);
    else openSheet(app, btn);
  });

  /* ---- Overlay / sheet / modal ---- */
  var overlay = $('overlay'), sheet = $('sheet'), modal = $('reqModal');

  function lock(on) { document.body.style.overflow = on ? 'hidden' : ''; }

  function openSheet(app, trigger) {
    currentApp = app; lastFocus = trigger || document.activeElement;
    $('sheetIcon').outerHTML = iconHTML(app).replace('class="icon"', 'class="icon" id="sheetIcon"');
    $('sheetTitle').textContent = app.name;
    $('sheetBadges').innerHTML = badgesHTML(app);
    $('sheetFeatures').innerHTML = (app.features || []).map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('');
    $('spVersion').textContent = app.version; $('spSize').textContent = app.size;
    $('spAndroid').textContent = app.android; $('spUpdated').textContent = app.updated;
    $('sheetMirror').hidden = !validLink(app.mirror) && app.mirror !== '#';
    sheet.style.transform = '';
    overlay.classList.add('open'); sheet.classList.add('open'); lock(true);
    $('sheetClose').focus();
  }
  function closeSheet() {
    sheet.classList.remove('open'); sheet.style.transform = '';
    if (!modal.classList.contains('open')) { overlay.classList.remove('open'); lock(false); }
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function openModal() {
    lastFocus = document.activeElement;
    overlay.classList.add('open'); modal.classList.add('open'); lock(true);
    setTimeout(function () { $('reqName').focus(); }, 50);
  }
  function closeModal() {
    modal.classList.remove('open');
    if (!sheet.classList.contains('open')) { overlay.classList.remove('open'); lock(false); }
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function closeAll() { if (sheet.classList.contains('open')) closeSheet(); if (modal.classList.contains('open')) closeModal(); }

  overlay.addEventListener('click', closeAll);
  $('sheetClose').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });
  $('sheetDl').addEventListener('click', function () { if (currentApp) download(currentApp, false); });
  $('sheetMirror').addEventListener('click', function () { if (currentApp) download(currentApp, true); });

  /* swipe the sheet handle down to close */
  (function () {
    var startY = null, dy = 0, grab = $('grab');
    grab.addEventListener('touchstart', function (e) { startY = e.touches[0].clientY; dy = 0; sheet.classList.add('dragging'); }, { passive: true });
    grab.addEventListener('touchmove', function (e) {
      if (startY === null) return;
      dy = Math.max(0, e.touches[0].clientY - startY);
      sheet.style.transform = 'translateY(' + dy + 'px)';
    }, { passive: true });
    grab.addEventListener('touchend', function () {
      sheet.classList.remove('dragging');
      if (dy > 90) closeSheet(); else sheet.style.transform = '';
      startY = null;
    });
  })();

  /* ---- Request a mod ---- */
  $('requestBtn').addEventListener('click', openModal);
  $('reqCancel').addEventListener('click', closeModal);
  $('reqName').addEventListener('input', function () { $('fName').classList.remove('bad'); });
  modal.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('reqName').value.trim(), notes = $('reqNotes').value.trim();
    if (!name) { $('fName').classList.add('bad'); $('reqName').focus(); return; }
    var text = 'Mod request\nApp: ' + name + (notes ? '\nNotes: ' + notes : '');
    function go() {
      closeModal();
      $('reqName').value = ''; $('reqNotes').value = '';
      var a = document.createElement('a');
      a.href = TELEGRAM_GROUP; a.target = '_blank'; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
    }
    function fallback() {
      var done = function (ok) {
        toast(ok ? 'Request copied. Paste it in Telegram.' : 'Opening Telegram. Type your request there.');
        setTimeout(go, 700);
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
        } else { done(false); }
      } catch (err) { done(false); }
    }

    /* No endpoint set yet: copy the request and open Telegram. */
    if (!REQUEST_ENDPOINT) { fallback(); return; }

    /* One request per minute per device (light spam guard). */
    try {
      var last = Number(localStorage.getItem('bm_last_req') || 0);
      if (Date.now() - last < 60000) { toast('Please wait a minute before sending another request.'); return; }
    } catch (err) {}

    var sendBtn = modal.querySelector('button[type="submit"]');
    sendBtn.disabled = true; sendBtn.textContent = 'Sending...';
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 10000);
    fetch(REQUEST_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, notes: notes }),
      signal: ctrl.signal
    }).then(function (r) {
      if (!r.ok) throw new Error('bad status');
      try { localStorage.setItem('bm_last_req', String(Date.now())); } catch (err) {}
      toast('Request sent to our Telegram!');
      closeModal(); $('reqName').value = ''; $('reqNotes').value = '';
    }).catch(function () {
      toast('Could not send. Copying your request instead.');
      fallback();
    }).then(function () {
      clearTimeout(timer); sendBtn.disabled = false; sendBtn.textContent = 'Send on Telegram';
    });
  });

  /* ---- Carousel: peek hint on load, and mouse drag on desktop ---- */
  (function () {
    var c = $('carousel');
    var down = false, sx = 0, sl = 0, moved = false;
    c.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'mouse') return;
      down = true; moved = false; sx = e.clientX; sl = c.scrollLeft; c.style.scrollSnapType = 'none';
    });
    window.addEventListener('pointermove', function (e) {
      if (!down) return;
      var dx = e.clientX - sx; if (Math.abs(dx) > 4) moved = true;
      c.scrollLeft = sl - dx;
    });
    window.addEventListener('pointerup', function () { if (down) { down = false; c.style.scrollSnapType = ''; } });
    c.addEventListener('click', function (e) { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);

    /* small nudge so people see the row slides (skipped if reduced motion) */
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setTimeout(function () {
        if (c.scrollWidth <= c.clientWidth || c.scrollLeft > 0) return;
        c.scrollTo({ left: 60, behavior: 'smooth' });
        setTimeout(function () { c.scrollTo({ left: 0, behavior: 'smooth' }); }, 650);
      }, 900);
    }
  })();

  render();
})();
</script>
</body>
</html>
